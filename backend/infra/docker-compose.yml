# =============================================================================
# 代驾项目本地依赖服务编排（仅本目录，不修改 daijia-parent 下任何源码）
#
#   启动：docker compose -f infra/docker-compose.yml up -d
#   停止：docker compose -f infra/docker-compose.yml stop
#   查看：docker compose -f infra/docker-compose.yml ps
#
# 首次启动 MySQL 会自动执行 /docker-entrypoint-initdb.d 下的
#   01-daijia.sql       （backend/sql/daijia.sql，8 个业务库 + xxl_job 之外的数据）
#   02-xxl-job.sql      （backend/sql/tables_xxl_job.sql，2.3.0 表结构）
# 这两个脚本只在数据卷为空时执行一次；如需重新初始化：
#   docker compose -f infra/docker-compose.yml down -v
# =============================================================================
name: roadrescue-infra

services:
  # --------------------------------------------------------------- MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: roadrescue-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 兼容老客户端（JDBC URL 未带 allowPublicKeyRetrieval 时也能连）
      - --default-authentication-plugin=mysql_native_password
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: "shangguigu@QY123"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - roadrescue-mysql-data:/var/lib/mysql
      - ../sql/daijia.sql:/docker-entrypoint-initdb.d/01-daijia.sql:ro
      - ../sql/tables_xxl_job.sql:/docker-entrypoint-initdb.d/02-xxl-job.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysql -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s
    mem_limit: 768m
    networks:
      - roadrescue-net

  # ------------------------------------------------------------------- Redis
  redis:
    image: redis:7
    container_name: roadrescue-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - roadrescue-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      - roadrescue-net

  # ---------------------------------------------------------------- RabbitMQ
  # 延迟队列插件 .ez 放在 infra/rabbitmq/；enabled_plugins 同时启用 management + 延迟插件
  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: roadrescue-rabbitmq
    hostname: roadrescue-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: "/"
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - roadrescue-rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/rabbitmq_delayed_message_exchange-3.9.0.ez:/opt/rabbitmq/plugins/rabbitmq_delayed_message_exchange-3.9.0.ez:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    mem_limit: 512m
    networks:
      - roadrescue-net

  # ----------------------------------------------------------------- MongoDB
  mongo:
    image: mongo:6.0
    container_name: roadrescue-mongo
    restart: unless-stopped
    # 限制 WiredTiger 缓存，避免吃满内存
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "27017:27017"
    volumes:
      - roadrescue-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    mem_limit: 512m
    networks:
      - roadrescue-net

  # -------------------------------------------------- Nacos 2.3.0 standalone
  # 2.x 客户端还需要 9848（gRPC）端口，必须一起映射
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: roadrescue-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 384m
      JVM_XMX: 384m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - roadrescue-nacos-data:/home/nacos/data
      - ./data/nacos/logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    mem_limit: 800m
    networks:
      - roadrescue-net

  # ------------------------------------------------------ XXL-JOB admin 2.3.0
  # 注意：docker hub 上 xuxueli/xxl-job-admin:2.3.0 镜像里的 admin 实际是旧版本，
  # 没有 /jobinfo/addAndStartJob、/jobinfo/startJob 等接口（项目 dispatch 用到），
  # 因此这里用仓库内 xxl-job-master(2.3.0) 源码构建出的 jar 覆盖 /app.jar。
  # 构建：cd xxl-job-master && mvn -pl xxl-job-admin -am -DskipTests package
  #      copy xxl-job-master\xxl-job-admin\target\xxl-job-admin-2.3.0.jar infra\artifacts\xxl-job-admin.jar
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.3.0
    container_name: roadrescue-xxl-job-admin
    restart: unless-stopped
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=shangguigu@QY123
        --xxl.job.accessToken=default_token
      # 镜像入口是 `java -jar $JAVA_OPTS /app.jar`，-Xmx 放 JAVA_OPTS 会错位，
      # 必须用 JAVA_TOOL_OPTIONS 让 JVM 自己识别
      JAVA_TOOL_OPTIONS: "-Xms192m -Xmx192m -XX:MaxMetaspaceSize=128m"
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - ./artifacts/xxl-job-admin.jar:/app.jar:ro
      - ./data/xxl-job/applogs:/data/applogs
      - ./scripts/xxl-job-admin-healthcheck.sh:/healthcheck/xxl-job-admin.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash /healthcheck/xxl-job-admin.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    mem_limit: 512m
    networks:
      - roadrescue-net

networks:
  roadrescue-net:
    name: roadrescue-net
    driver: bridge

volumes:
  roadrescue-mysql-data:
  roadrescue-redis-data:
  roadrescue-rabbitmq-data:
  roadrescue-mongo-data:
  roadrescue-nacos-data:
