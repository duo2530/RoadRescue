spring.application.name=service-payment
spring.profiles.active=dev
spring.main.allow-bean-definition-overriding=true
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.cloud.nacos.config.server-addr=127.0.0.1:8848
spring.cloud.nacos.config.prefix=${spring.application.name}
spring.cloud.nacos.config.file-extension=yaml
spring.cloud.nacos.config.shared-configs[0].data-id=common-account.yaml

roadrescue.payment.wechat.enabled=false
roadrescue.payment.alipay.enabled=${ALIPAY_SANDBOX_ENABLED:false}
roadrescue.payment.alipay.gateway-url=${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
roadrescue.payment.alipay.app-id=${ALIPAY_APP_ID:}
roadrescue.payment.alipay.private-key=${ALIPAY_PRIVATE_KEY:}
roadrescue.payment.alipay.public-key=${ALIPAY_PUBLIC_KEY:}
roadrescue.payment.alipay.seller-id=${ALIPAY_SELLER_ID:}
roadrescue.payment.alipay.notify-url=${ALIPAY_NOTIFY_URL:}
roadrescue.payment.alipay.h5-return-url=${ALIPAY_H5_RETURN_URL:http://localhost:9090/#/pages/order/detail}
roadrescue.payment.alipay.allowed-return-origins=${ALIPAY_ALLOWED_RETURN_ORIGINS:http://localhost:9090,http://127.0.0.1:9090}

