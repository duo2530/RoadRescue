server:
  port: 8601
feign:
  sentinel:
    enabled: true
spring:
  main:
    allow-bean-definition-overriding: true #当遇到同样名字的时候，是否允许覆盖注册
  cloud:
    openfeign:
      lazy-attributes-resolution: true #开启懒加载，否则启动报错
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 30000
            loggerLevel: basic
  rabbitmq:
    host: ${daijia.rabbitmq.host:127.0.0.1}
    port: 5672
    username: admin
    password: admin123
    publisher-confirm-type: correlated
    publisher-returns: true
  data:
    redis:
      host: ${daijia.redis.host:localhost}
      port: 6379
      database: 0
      timeout: 1800000
      password:
      jedis:
        pool:
          max-active: 20 #最大连接数
          max-wait: -1    #最大阻塞等待时间(负数表示没限制)
          max-idle: 5    #最大空闲
          min-idle: 0     #最小空闲
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB     #单个文件最大限制
      max-request-size: 20MB  #多个文件最大限制
seata:
  tx-service-group: daijia_tx_group
  enable-auto-data-source-proxy: false
# 道路救援 H5 演示登录（/customer/demoLogin、/driver/demoLogin），生产环境改为 false
roadrescue:
  demo-login:
    enabled: true
    customer-id: 1
    driver-id: 1
  # 没有短信服务商时的演示验证码（非空则固定为该值并在发送接口返回），生产环境必须清空
  sms:
    demo-code: "123456"
